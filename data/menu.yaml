            label_en: Too hot
            label_es: Mucho calor
            phrase_en: "I'm too hot. Can you cool the room?"
            phrase_es: "Tengo mucho calor. ¿Puedes refrescar el cuarto?"
            action: speak
          - id: too_cold
            label_en: Too cold
            label_es: Mucho frío
            phrase_en: "I'm cold. Can I have a blanket?"
            phrase_es: "Tengo frío. ¿Me das una cobija?"
            action: speak

  - id: people
    label_en: People
    label_es: Personas
    from_contacts: true

  - id: feel
    label_en: How I feel
    label_es: Cómo me siento
    children:
