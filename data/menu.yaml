                action: speak
              - id: a_lot
                label_en: A lot
                label_es: Mucho
                phrase_en: "My stomach hurts a lot. Please check on me."
                phrase_es: "Me duele mucho el estómago. Por favor, revísame."
                action: speak
          - id: chest
            label_en: Chest
            label_es: Pecho
            children:
              - id: a_little
                label_en: A little
                label_es: Un poco
                phrase_en: "My chest hurts a little."
                phrase_es: "Me duele un poco el pecho."
                action: speak
              - id: a_lot
                label_en: A lot
                label_es: Mucho
                phrase_en: "My chest hurts a lot. Please get help now."
                phrase_es: "Me duele mucho el pecho. Por favor, busca ayuda ya."
                action: speak
          - id: legs
            label_en: Legs
            label_es: Piernas
            children:
              - id: a_little
                label_en: A little
                label_es: Un poco
                phrase_en: "My legs hurt a little."
                phrase_es: "Me duelen un poco las piernas."
                action: speak
              - id: a_lot
                label_en: A lot
                label_es: Mucho
                phrase_en: "My legs hurt a lot. Can you move them for me?"
                phrase_es: "Me duelen mucho las piernas. ¿Me las puedes mover?"
                action: speak
        more:
          - id: arms
            label_en: Arms
            label_es: Brazos
            children:
              - id: a_little
                label_en: A little
                label_es: Un poco
                phrase_en: "My arms hurt a little."
                phrase_es: "Me duelen un poco los brazos."
                action: speak
              - id: a_lot
