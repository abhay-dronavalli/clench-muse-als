        phrase_es: "Me siento triste."
        action: speak
      - id: scared
        label_en: Scared
        label_es: Miedo
        phrase_en: "I'm scared. Please stay with me."
        phrase_es: "Tengo miedo. Quédate conmigo, por favor."
