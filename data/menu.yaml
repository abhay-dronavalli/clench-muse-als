            phrase_es: "Por favor, siéntame."
            action: speak
          - id: lie_down
            label_en: Lie me down
            label_es: Acuéstame
            phrase_en: "Please help me lie down."
            phrase_es: "Por favor, ayúdame a acostarme."
            action: speak
          - id: pillow
